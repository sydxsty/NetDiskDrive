[package]
name = "overlaydisk_core"
version = "0.8.0"
edition = "2021"
license = "MIT"
description = "Local transactional block storage for OverlayDisk"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
overflow-checks = true
lto = "thin"
